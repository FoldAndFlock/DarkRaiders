<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ARK model gallery</title>
<style>
  html, body { margin: 0; height: 100%; background: #0c0c0e; color: #e8e0c8; font: 12px monospace; overflow: hidden; }
  canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  #ov { pointer-events: none; image-rendering: pixelated; }
  #info { position: fixed; left: 4px; bottom: 4px; background: rgba(0,0,0,.7); padding: 2px 6px; z-index: 5; white-space: pre; }
</style>
</head>
<body>
<canvas id="gl"></canvas>
<canvas id="ov"></canvas>
<div id="info">loading…</div>
<!--
  ARK model gallery. URL params:
    ids=tikk,popp|wazp,hornett   rows separated by '|' (ARK ids from src/data/arc.js; default = all)
    zoom=fit|1|4                 fit = fit everything (default), 1 = game scale (16 px/m), 4 = 4x detail
    state=idle|move|alert|tele|fire|stun|leap|broken|demo|mix
    face=20                      facing in degrees (0 = towards camera); rear=1 adds a rear-view copy
    time=noon|dusk|night|dawn  weather=clear|fog|rain...   alt=low|real (flyer altitude)
    frames=60                    frames simulated before window.__ready; live=0 stops animating after that
    raider=0                     hide the scale raider at the start of each row
-->
<script type="module" src="./arkgallery.js"></script>
</body>
</html>
