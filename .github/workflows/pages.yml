# Publish the game to GitHub Pages on every push to main (or by hand from the Actions tab).
# The game is plain static files (no build step): only what the browser needs is shipped.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Each deploy's code lives under its own v/<sha>/ path, so a browser's 10-minute cache can never
      # mix files from two versions (the root keeps index.html, the manifest and plain asset copies).
      - name: Stage the game files
        run: |
          V="v/${GITHUB_SHA::10}"
          mkdir -p "_site/$V"
          cp -r src vendor assets "_site/$V/"
          cp -r manifest.webmanifest assets _site/
          sed -E "s#(href|src)=\"(src|vendor|assets)/#\1=\"$V/\2/#g" index.html > _site/index.html
          grep -n "$V" _site/index.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
